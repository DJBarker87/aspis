[package]
name = "aspis-verifier"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Aspis on-chain verifier program: PCS verification plus isolated Stage 2 statement-cost probes"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
aspis-core = { path = "../../crates/aspis-core" }
aspis-statement = { path = "../../crates/aspis-statement" }
borsh.workspace = true
solana-program.workspace = true

[dev-dependencies]
aspis-prover = { path = "../../crates/aspis-prover", features = ["insecure-test-framing"] }
