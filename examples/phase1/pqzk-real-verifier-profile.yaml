name: pqzk-real-verifier-profile
features:
  sha_calls: 435
  sha_bytes: 27804
  merkle_paths: 54
  merkle_levels: 378
  proof_bytes: 4211
  proof_segments: 1
  upload_bytes: 0
  upload_chunks: 0
  heap_frame_bytes_requested: 262144
  heap_pages_32k: 8
  ro_account_count: 1
  rw_account_count: 0
  account_data_bytes_read: 5499
  account_data_bytes_written: 0
  field_add_sub_ops: 243
  field_mul_ops: 243
  field_inv_ops: 4
  extension_mul_ops: 0
protocol_family: Winterfell-FRI
transport:
  sha_calls: 0
  sha_bytes: 0
  upload_bytes: 0
  upload_chunks: 0
parameter_choices:
- name: proof_bytes
  value: '4211'
  rationale: Directly measured from the locally generated proof.bin emitted by the external pqzk-labs prover.
  sources:
  - https://github.com/pqzk-labs/solana-pqzk-fullchain
- name: num_queries
  value: '30'
  rationale: Taken directly from the prover's ProofOptions::new(30, 16, 8, FieldExtension::None, 4, 31, ...).
  sources:
  - https://github.com/pqzk-labs/solana-pqzk-fullchain
  - https://eprint.iacr.org/2025/1741
- name: heap_frame_bytes_requested
  value: '262144'
  rationale: Matches the external verifier's documented 256 KiB heap request for verify_stark.
  sources:
  - https://github.com/pqzk-labs/solana-pqzk-fullchain
references:
- https://github.com/pqzk-labs/solana-pqzk-fullchain
- https://eprint.iacr.org/2025/1741
query_soundness_model:
  model: fri
  query_count: 30
  log_blowup: 4
  query_proof_of_work_bits: 8
  target_bits: 128.0
  sources:
  - https://eprint.iacr.org/2020/654
  - https://eprint.iacr.org/2021/582
  - https://github.com/Plonky3/Plonky3/blob/main/fri/src/prover.rs
  notes:
  - Query soundness is attached here to make the real-verifier comparison explicit about its 30-query, blowup-16 configuration.
notes:
- Intended to approximate the external verify_stark phase only; upload transport is set to zero because the comparison target is the repo's verify-only benchmark.
- Hash, Merkle, and account-byte features are structure-derived from the proof and verifier layout.
- Field-operation counts are source-backed verifier-kernel proxies, not dynamic Winterfell counters.
- field_inv_ops uses an execution-structure proxy of 4 rather than the earlier query-scaled proxy of 27.
- field_mul_ops uses a source-backed proxy of 243 built from remainder Horner multiplications (216) plus queried x-coordinate lifts (27).
