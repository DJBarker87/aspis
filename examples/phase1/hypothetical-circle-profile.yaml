name: hypothetical-circle-profile
features:
  sha_calls: 62
  sha_bytes: 13760
  merkle_paths: 4
  merkle_levels: 40
  proof_bytes: 5120
  proof_segments: 10
  upload_bytes: 5120
  upload_chunks: 10
  heap_frame_bytes_requested: 98304
  heap_pages_32k: 3
  ro_account_count: 4
  rw_account_count: 1
  account_data_bytes_read: 4096
  account_data_bytes_written: 128
  field_add_sub_ops: 3072
  field_mul_ops: 1024
  field_inv_ops: 48
  extension_mul_ops: 96
protocol_family: Circle
transport:
  sha_calls: 10
  sha_bytes: 5440
  upload_bytes: 5120
  upload_chunks: 10
parameter_choices:
- name: query_count
  value: '4'
  rationale: Treats query count as the primary soundness lever in the Circle family and exposes it directly in the sweep.
  sources:
  - https://eprint.iacr.org/2024/278
  - https://eprint.iacr.org/2024/1810
- name: chunk_size_bytes
  value: '512'
  rationale: Chosen to stay comfortably below the Solana transaction byte cap after non-payload overhead.
  sources: []
- name: proof_bytes
  value: '5120'
  rationale: Swept around the base 5,120-byte profile to test transport and parse sensitivity without changing the overall statement family.
  sources:
  - https://eprint.iacr.org/2024/278
references:
- https://eprint.iacr.org/2024/278
- https://eprint.iacr.org/2024/1810
- https://eprint.iacr.org/2024/1635
notes:
- Exploratory Circle profile with proof_bytes=5120, chunk_size=512, query_count=4.
- Not security-certified; intended for relative SVM pressure comparison only.
