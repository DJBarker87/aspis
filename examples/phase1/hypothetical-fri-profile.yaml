name: hypothetical-fri-profile
features:
  sha_calls: 118
  sha_bytes: 25856
  merkle_paths: 6
  merkle_levels: 84
  proof_bytes: 9216
  proof_segments: 12
  upload_bytes: 9216
  upload_chunks: 16
  heap_frame_bytes_requested: 131072
  heap_pages_32k: 4
  ro_account_count: 5
  rw_account_count: 2
  account_data_bytes_read: 6144
  account_data_bytes_written: 256
  field_add_sub_ops: 6144
  field_mul_ops: 1536
  field_inv_ops: 96
  extension_mul_ops: 192
protocol_family: FRI
transport:
  sha_calls: 16
  sha_bytes: 9728
  upload_bytes: 9216
  upload_chunks: 16
parameter_choices:
- name: query_count
  value: '6'
  rationale: Keeps the profile in the conservative, high-query regime used for a first-pass infeasibility screen rather than tuning down soundness to fit budget.
  sources:
  - https://eprint.iacr.org/2024/1810
- name: merkle_depth
  value: '14'
  rationale: Represents a deep authentication surface consistent with FRI-style query pressure under transparent settings.
  sources:
  - https://eprint.iacr.org/2024/1810
- name: chunk_size_bytes
  value: '576'
  rationale: Leaves headroom under Solana's transaction byte cap once instruction and account metadata are included.
  sources: []
references:
- https://eprint.iacr.org/2024/1810
notes:
- Exploratory FRI-shaped profile for Phase 1 scoring; not tied to a production verifier implementation.
- Used as an upper-pressure comparison point, not a claim about an optimized FRI verifier.
