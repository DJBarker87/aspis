name: spend-circle-p7168-c448-q6
features:
  sha_calls: 158
  sha_bytes: 24832
  merkle_paths: 8
  merkle_levels: 124
  proof_bytes: 7168
  proof_segments: 14
  upload_bytes: 7168
  upload_chunks: 16
  heap_frame_bytes_requested: 98304
  heap_pages_32k: 3
  ro_account_count: 6
  rw_account_count: 1
  account_data_bytes_read: 7680
  account_data_bytes_written: 256
  field_add_sub_ops: 3184
  field_mul_ops: 1520
  field_inv_ops: 8
  extension_mul_ops: 224
protocol_family: Circle
transport:
  sha_calls: 16
  sha_bytes: 7680
  upload_bytes: 7168
  upload_chunks: 16
parameter_choices:
- name: query_count
  value: '6'
  rationale: Literal absolute proof-oracle queries in the screening model. Each unit of q contributes one proof-side Merkle authentication path; q is not a round count and not multiplied by hidden batching.
  sources:
  - https://eprint.iacr.org/2024/278
  - https://eprint.iacr.org/2024/1161
- name: query_security_status
  value: query_soundness_assessed
  rationale: 'Query soundness is assessed with FRI-style lower and upper bounds at blowup 16: a proven rate^(q/2) lower bound and a conjectured ethSTARK-style rate^q upper bound, plus 0 query-grinding bits.'
  sources:
  - https://eprint.iacr.org/2024/278
  - https://eprint.iacr.org/2024/1161
- name: log_blowup
  value: '4'
  rationale: Sweeps the Circle/FRI blowup factor jointly with q and grinding; higher values improve soundness but deepen proof authentication paths.
  sources:
  - https://eprint.iacr.org/2020/654
  - https://eprint.iacr.org/2021/582
- name: query_proof_of_work_bits
  value: '0'
  rationale: Verifier-side grinding is modeled as a fixed-size witness check when enabled; difficulty bits mainly move security, not verifier work.
  sources:
  - https://github.com/Plonky3/Plonky3/blob/main/fri/src/config.rs
  - https://github.com/Plonky3/Plonky3/blob/main/fri/src/verifier.rs
- name: chunk_size_bytes
  value: '448'
  rationale: Upload chunking remains an explicit transport lever under the Solana transaction byte cap.
  sources: []
- name: proof_bytes
  value: '7168'
  rationale: Proof bytes were overridden after structured arithmetization to sweep transport sensitivity around the derived baseline.
  sources:
  - https://eprint.iacr.org/2024/278
- name: evaluation_domain_log2
  value: '13'
  rationale: Derived from the explicit spend arithmetization row budget rather than a hand-picked verifier proxy count.
  sources: []
references:
- https://eprint.iacr.org/2024/278
- https://eprint.iacr.org/2024/1161
- https://eprint.iacr.org/2024/1810
- https://eprint.iacr.org/2020/654
- https://eprint.iacr.org/2021/582
query_soundness_model:
  model: fri
  query_count: 6
  log_blowup: 4
  query_proof_of_work_bits: 0
  target_bits: 128.0
  sources:
  - https://eprint.iacr.org/2020/654
  - https://eprint.iacr.org/2021/582
  - https://github.com/Plonky3/Plonky3/blob/main/fri/src/config.rs
  - https://github.com/Plonky3/Plonky3/blob/main/fri/src/prover.rs
  notes:
  - Circle spend scoring treats q as the literal FRI query count.
notes:
- Structured spend-screen profile derived from explicit statement and arithmetization assumptions; total_rows=6720, log2_rows=13.
- Literal absolute proof-oracle queries in the screening model. Each unit of q contributes one proof-side Merkle authentication path; q is not a round count and not multiplied by hidden batching.
- 'Query soundness is assessed with FRI-style lower and upper bounds at blowup 16: a proven rate^(q/2) lower bound and a conjectured ethSTARK-style rate^q upper bound, plus 0 query-grinding bits.'
- This tuned screen uses log_blowup=4 and grinding_bits=0.
- field_inv_ops uses a structural proxy of 8 instead of the earlier query-scaled proxy of 16.
- Derived proof_bytes baseline was 6712; this profile overrides it to 7168 for transport sensitivity.
