[package]
name = "aspis-v7-live-pool-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.100"
aspis-core = { path = "../../crates/aspis-core" }
aspis-pool = { path = "../../programs/aspis-pool", default-features = false, features = ["no-entrypoint", "pair-forest-account-evidence"] }
aspis-prover = { path = "../../crates/aspis-prover" }
aspis-pool-wallet-v1 = { path = "../../crates/aspis-pool-wallet-v1", features = ["eight-lane-plumbing-v2"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["pool-v1-kernel"] }
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
getrandom = "0.2.16"
hex = "0.4.3"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "x25519"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-keypair = "=2.2.3"
solana-compute-budget-interface = "=2.2.2"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-program = "=2.3.0"
solana-signer = "=2.2.1"
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
solana-signature-v1 = { package = "solana-signature", version = "=3.4.1" }
solana-transaction-v1 = { package = "solana-transaction", version = "=4.1.5", features = ["wincode"] }
wincode = "=0.5.0"

[[bin]]
name = "prove-from-live-bundle"
path = "src/bin/prove_from_live_bundle.rs"

[[bin]]
name = "prepare-live-genesis"
path = "src/bin/prepare_live_genesis.rs"

[[bin]]
name = "build-live-pool-initialize"
path = "src/bin/build_live_pool_initialize.rs"

[[bin]]
name = "create-live-operation-secrets"
path = "src/bin/create_live_operation_secrets.rs"

[[bin]]
name = "build-live-pool-deposit"
path = "src/bin/build_live_pool_deposit.rs"

[[bin]]
name = "build-live-pool-checkpoint"
path = "src/bin/build_live_pool_checkpoint.rs"

[[bin]]
name = "materialize-live-proof-bundle"
path = "src/bin/materialize_live_proof_bundle.rs"

[[bin]]
name = "build-live-transfer-terminal"
path = "src/bin/build_live_transfer_terminal.rs"
