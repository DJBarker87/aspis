[package]
name = "aspis-v7-txv1-honest-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.100"
aspis-core = { path = "../../crates/aspis-core", features = ["v7-fixed-canonical-audit"] }
aspis-pool = { path = "../../programs/aspis-pool", features = ["no-entrypoint", "pair-forest-account-evidence"] }
aspis-prover = { path = "../../crates/aspis-prover", features = ["insecure-spend-fixture"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["pool-v1-kernel"] }
base64 = "0.22.1"
bincode = "1.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-keypair = "=2.2.3"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-program = "=2.3.0"
solana-signer = "=2.2.1"
solana-transaction = { version = "=2.2.3", features = ["bincode"] }

