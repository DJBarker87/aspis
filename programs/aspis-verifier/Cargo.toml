[package]
name = "aspis-verifier"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Aspis on-chain verifier program: Spend production verification and proof-account lifecycle"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["spend-production", "v5-production-tag67"]
no-entrypoint = []
custom-heap = []
custom-panic = []
# The reviewed production closure: the minimal wire surface plus query-local
# public RATE512 coordinates.
spend-production = [
    "spend-minimal-dispatch",
    "spend-dynamic-rate512",
]
# Production-only entrypoint registration. The deployed entrypoint accepts
# the lifecycle tags and only the explicitly enabled frozen proof versions;
# every other tag fails closed before account access.
spend-minimal-dispatch = []
# Production derives only the 18 authenticated Rate-1/512 query paths instead
# of linking six full-domain coordinate tables into the deployed ELF.
spend-dynamic-rate512 = ["aspis-statement/spend-dynamic-rate512"]
# Local-validator-only entrypoint used for the v5 diagnostic
# kernels (tag 66) and complete atomic transaction CU wrapper (tag 67).
# An entrypoint build is deliberately incompatible with `spend-production`;
# feature-unified host tooling must also enable `no-entrypoint`.
v5-cu-probe = []
# Local-validator-only entrypoint for the V6 26+3 packed parser and arithmetic
# kernels. It is intentionally incompatible with every production entrypoint.
v6-cu-probe = []
# Local-validator-only entrypoint for the compact V7 verifier. It retains the
# complete atomic wrapper while allowing work-hash acceptance to be isolated
# from the production Tag-73 binary during CU development.
v7-cu-probe = []
# Local-only CU profiler for one honest native Pool Tag-73 proof.  It exposes
# the production cryptographic path behind a distinct entrypoint and logs
# coarse phase boundaries.  It is deliberately not a production feature.
v7-pool-cu-profile = ["aspis-statement/pool-v1-kernel"]
# Frozen production switch. This compiles tag 67 into the minimal production
# dispatcher and routes it only through the atomic verify-and-apply wrapper.
# The executable, transcript, formal, and CU gates are recorded in the release
# preflight. This feature is included in `default`.
v5-production-tag67 = ["spend-production"]
# Candidate production switch for the V6 26+3 one-fold verifier. Tag 72 uses
# real SHA-256 work checks, exact semantic-terminal equality, canonical packed
# parsing, and the unchanged atomic verify-and-apply wrapper. It remains
# opt-in until the V6 release gates and devnet receipt are frozen.
v6-production-tag72 = ["spend-production"]
# Candidate production switch for the compact V7 successor. Tag 73 uses the
# same 26+3 relation and atomic state transition as V6, with 208-bit Merkle
# digests, a single cap-203 query stream, and complete authenticated C2
# fibres. It stays opt-in until the V7 release gates are frozen.
v7-production-tag73 = ["spend-production"]
# Opt-in Pool verifier surface. It retains the frozen Tag-73 proof relation
# and adds only the ASVQ read-only profile handler. Existing Tag-73 release
# builds do not enable this feature and therefore remain byte-isolated.
v7-pool-dispatch-profile = [
    "v7-production-tag73",
    "aspis-statement/pool-v1-kernel",
]
# Default-off eight-lane Pool request validator.  The account/PDA/codec and
# exact ASF8 reconstruction boundary is executable, but the route remains
# fail-closed until the merged-C1 forest terminal is part of the accepted
# Tag-73 verifier.
v7-pair-forest-asq8 = [
    "v7-production-tag73",
    "aspis-statement/pool-v1-kernel",
]
# Audit-only full-statement transport. It invokes the same cryptographic path
# after independently authenticating the supplied 1,880-byte ASF8.
v7-pair-forest-asf8-audit = [
    "v7-production-tag73",
    "aspis-statement/pool-v1-kernel",
]
# Audit-only +320-byte canonical fixed-field proof grammar. The ASQ8 account
# transport and every semantic/work/Merkle check remain unchanged.
v7-pair-forest-fixed-canonical-audit = [
    "v7-production-tag73",
    "aspis-statement/pool-v1-kernel",
    "aspis-core/v7-fixed-canonical-audit",
]
# Audit-only exact-once consumer for the +320-byte canonical fixed grammar.
# It changes no bytes: only the redundant eager scan of the still-packed query
# section is removed, and the gamma consumer retains every canonicality check.
v7-pair-forest-fixed-canonical-exact-once-audit = [
    "v7-pair-forest-fixed-canonical-audit",
    "aspis-core/v7-fixed-canonical-exact-once-audit",
]
# Audit-only loop interchange in the q16 C1 gamma combination. The same
# canonical 31-bit limbs and exact prepared power table are consumed, but each
# power row is loaded once for all four output slots.
v7-gamma-four-slot-block-audit = [
    "aspis-core/v7-gamma-four-slot-block-audit",
]
# Audit-only exact linear factoring inside the selected semantic terminal.
# Four digest residual lanes are packed before their shared row selector is
# applied. Wire bytes, transcript order, theta lanes, and relation parameters
# are unchanged; released/default builds do not enable this experiment.
v7-pair-forest-packed-digest-audit = [
    "aspis-statement/pool-v1-pair-forest-packed-digest-audit",
]
# Audit-only tensor contraction for the packed public-digest selectors. The
# same rows, expected digests, tweaks and two theta lanes are enforced.
v7-pair-forest-packed-digest-selector-tensor-audit = [
    "v7-pair-forest-packed-digest-audit",
    "aspis-statement/pool-v1-pair-forest-packed-digest-selector-tensor-audit",
]
# Audit-only specialization of generated Copy weights, all of which are
# exactly zero or one after variant/index selection. Values are still
# accumulated for every endpoint; only `selector * {0,1}` becomes skip/add.
v7-pair-forest-binary-copy-weights-audit = [
    "aspis-statement/pool-v1-pair-forest-binary-copy-weights-audit",
]
# Audit-only hot decoder for selected lane PDAs owned by the exact Pool
# release. It keeps every canonical/account/PDA check and omits only the
# persisted active root/frontier Poseidon reconstruction, which is an
# inductive invariant of Pool constructors and writers.
v7-pair-forest-lane-invariant-audit = []
# Audit-only cache for repeated generated Copy endpoint rows. A cached row
# selector is consumed only after an exact row-tag match; misses use the
# unchanged high[row>>4] * low[row&15] computation.
v7-pair-forest-endpoint-selector-cache-audit = [
    "aspis-statement/pool-v1-pair-forest-endpoint-selector-cache-audit",
]
# Audit-only common-factor extraction in schedule, path, and occupancy
# residuals. The wire, transcript, semantic relation, and theta packing do not
# change; focused off-domain tests compare the literal and factored kernels.
v7-pair-forest-semantic-factor-audit = [
    "aspis-statement/pool-v1-pair-forest-semantic-factor-audit",
]
# Audit-only CSE for the frozen generated Copy pattern table. Four overlapping
# eight-limb windows are evaluated once and exact subwindows are derived by
# subtraction; terminal equations and tuple bytes are unchanged.
v7-pair-forest-pattern-window-audit = [
    "aspis-statement/pool-v1-pair-forest-pattern-window-audit",
]
# Audit-only exact linear change of basis for the generated Copy endpoint
# values.  This does not alter the Copy tuples, weights, challenges, residual,
# wire, transcript, or accepted language.
v7-pair-forest-copy-pattern-basis-audit = [
    "aspis-statement/pool-v1-pair-forest-copy-pattern-basis-audit",
]
# Audit-only exact linear factoring of the 33 direct-range residuals.  The
# shared row selector is applied after base-4 packing, reducing 33 extension
# products to nine while preserving the same 24 semantic theta lanes.
v7-pair-forest-packed-range-audit = [
    "aspis-statement/pool-v1-pair-forest-packed-range-audit",
]
# Audit-only basis reduction for the Copy-active selector.  The frozen 64
# block masks have exactly seven distinct values, so equal masks are grouped
# before their high/low selector product is evaluated.
v7-pair-forest-active-mask-basis-audit = [
    "aspis-statement/pool-v1-pair-forest-active-mask-basis-audit",
]
# Audit-only tensor-basis evaluation of the frozen Copy endpoint selectors.
# It groups high-coordinate coefficients by the exact live `(group, pattern,
# local)` support before multiplying by the low selector coordinate.
v7-pair-forest-copy-selector-tensor-basis-audit = [
    "v7-pair-forest-copy-pattern-basis-audit",
    "aspis-statement/pool-v1-pair-forest-copy-selector-tensor-basis-audit",
]
# Audit-only lazy-reduction basis for the frozen Copy tag dot products. The
# same 272 selector/tag products are retained and merely reduced four at once.
v7-pair-forest-copy-tag-dot-basis-audit = [
    "v7-pair-forest-copy-selector-tensor-basis-audit",
    "aspis-statement/pool-v1-pair-forest-copy-tag-dot-basis-audit",
]
# Audit-only four-product contraction at the Copy tensor output boundary.
v7-pair-forest-copy-finish-dot-basis-audit = [
    "v7-pair-forest-copy-selector-tensor-basis-audit",
    "aspis-statement/pool-v1-pair-forest-copy-finish-dot-basis-audit",
]
# Exact one-transaction eight-lane release-candidate verifier selected by the
# combined TxV1 measurements. The alias prevents accidental omission of a CU
# optimisation or account invariant. It remains default-off until the named
# source/formal and correlated-grinding gates are closed.
v7-pair-forest-one-tx-candidate = [
    "v7-pair-forest-fixed-canonical-exact-once-audit",
    "v7-pair-forest-lane-invariant-audit",
    "v7-pair-forest-packed-digest-selector-tensor-audit",
    "v7-pair-forest-binary-copy-weights-audit",
    "v7-pair-forest-endpoint-selector-cache-audit",
    "v7-pair-forest-semantic-factor-audit",
    "v7-pair-forest-pattern-window-audit",
    "v7-pair-forest-copy-tag-dot-basis-audit",
    "v7-pair-forest-copy-finish-dot-basis-audit",
    "v7-pair-forest-packed-range-audit",
    "v7-pair-forest-active-mask-basis-audit",
    "v7-gamma-four-slot-block-audit",
]
# Adds compute-unit checkpoints to the selected pair-forest verifier without
# changing its wire, transcript, arithmetic, work, q16, or Merkle schedule.
# Use only for matched diagnostic builds; marker calls inflate total CU.
v7-pair-forest-verifier-cu-profile = []

[dependencies]
aspis-core = { path = "../../crates/aspis-core" }
aspis-statement = { path = "../../crates/aspis-statement" }
borsh.workspace = true
solana-program.workspace = true
solana-sdk-ids = "2.2.1"

[dev-dependencies]
aspis-prover = { path = "../../crates/aspis-prover", features = ["insecure-spend-fixture"] }
# Dispatch/lifecycle attack-surface fuzzing via proptest on the pinned stable
# toolchain (cargo-fuzz's nightly requirement would break the stable pin).
proptest = "1"
