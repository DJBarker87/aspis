[package]
name = "aspis-pool"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Pool V1 authenticated Solana state-transition program"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
# Measurement-only entrypoint for the proof-carried pair afterstate.  Release
# builds do not enable this feature until the real merged 26-C1/3-C2 verifier emits
# the authenticated ASJA result.
pair-afterstate-evidence = []
pair-afterstate-profile = ["pair-afterstate-evidence"]
# Production-inactive account/PDA/checkpoint/deposit/terminal plumbing for the
# accepted eight-lane forest candidate. Release builds leave it disabled.
pair-forest-account-evidence = []
# Local-only phase logging for the inactive eight-lane one-terminal caller.
# It changes no wire bytes or state semantics and is never enabled by default.
pair-forest-cu-profile = ["pair-forest-account-evidence"]
# Mutually exclusive, measurement-only ASR8 return-copy sweep points. The
# production ASR8 codec remains exactly 792 bytes.
pair-forest-cu-return-824 = ["pair-forest-cu-profile"]
pair-forest-cu-return-856 = ["pair-forest-cu-profile"]
pair-forest-cu-return-920 = ["pair-forest-cu-profile"]
pair-forest-cu-return-1024 = ["pair-forest-cu-profile"]

[dependencies]
aspis-core.workspace = true
aspis-statement = { workspace = true, features = ["pool-v1-kernel"] }
solana-program.workspace = true
solana-sdk-ids = "2.2.1"

[dev-dependencies]
sha2.workspace = true
