[package]
name = "aspis-core"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Aspis native WHIR-style M31 PCS substrate: shared no_std verifier core (host + SBF byte-exact)"

[features]
# Exposes deliberately weakened Fiat-Shamir schedules solely so adversarial
# tests can demonstrate their teeth. Never enable in a deployed verifier.
insecure-test-ordering = []
# Exposes a verifier mode that deliberately misclassifies the diagnostic M31
# basis as the legacy CM31 wire shape. Teeth tests only; never deploy.
insecure-test-framing = []
# Exposes private decoder entry points to the isolated universal-equivalence
# harness. This feature is never enabled by the verifier build.
formal-verification = []

[dependencies]

[dev-dependencies]
sha2 = "0.10.8"
# Property/fuzz-style harnesses run on the pinned stable toolchain via
# `cargo test`; cargo-fuzz's nightly+libFuzzer requirement would break the
# stable pin, so the attack-surface fuzzing is expressed as proptest.
proptest = "1"
