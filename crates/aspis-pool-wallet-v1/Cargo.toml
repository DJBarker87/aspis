[workspace]

[package]
name = "aspis-pool-wallet-v1"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated Pool V1 encrypted-note envelope, recipient scanner and durable cursor"

[[example]]
name = "tx_v1_devnet_probe"
required-features = ["eight-lane-plumbing-v2"]

[features]
default = []
eight-lane-plumbing-v2 = ["aspis-pool/pair-forest-account-evidence"]

[dependencies]
aspis-core = { path = "../aspis-core" }
aspis-pool = { path = "../../programs/aspis-pool", default-features = false, features = ["no-entrypoint"] }
aspis-registry = { path = "../../programs/aspis-registry", default-features = false, features = ["no-entrypoint"] }
aspis-statement = { path = "../aspis-statement" }
bincode = "=1.3.3"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "x25519"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = { version = "=0.11.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
solana-address-lookup-table-interface = { version = "=2.2.2", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=2.2.2"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-program = "=2.3.0"
solana-sdk-ids = "=2.2.1"
solana-signature = { version = "=2.3.0", features = ["verify"] }
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
solana-address-v1 = { package = "solana-address", version = "=2.6.1" }
solana-hash-v1 = { package = "solana-hash", version = "=4.4.0" }
solana-instruction-v1 = { package = "solana-instruction", version = "=3.4.0" }
solana-message-v1 = { package = "solana-message", version = "=4.2.4", features = ["wincode"] }
solana-sanitize-v1 = { package = "solana-sanitize", version = "=3.0.0" }
solana-sdk-ids-v1 = { package = "solana-sdk-ids", version = "=3.0.0" }
solana-short-vec-v1 = { package = "solana-short-vec", version = "=3.2.2" }
solana-signature-v1 = { package = "solana-signature", version = "=3.4.1" }
solana-transaction-v1 = { package = "solana-transaction", version = "=4.1.5", features = ["wincode"] }
solana-transaction-error-v1 = { package = "solana-transaction-error", version = "=3.3.1" }
subtle = { version = "=2.6.1", default-features = false }
wincode = "=0.5.0"
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
solana-keypair = "=2.2.3"
solana-signer = "=2.2.1"
