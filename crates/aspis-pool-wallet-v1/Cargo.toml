[workspace]

[package]
name = "aspis-pool-wallet-v1"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated Pool V1 encrypted-note envelope, recipient scanner and durable cursor"

[dependencies]
aspis-core = { path = "../aspis-core" }
aspis-pool = { path = "../../programs/aspis-pool", default-features = false, features = ["no-entrypoint"] }
aspis-registry = { path = "../../programs/aspis-registry", default-features = false, features = ["no-entrypoint"] }
aspis-statement = { path = "../aspis-statement" }
bincode = "=1.3.3"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "x25519"] }
sha2 = { version = "=0.11.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
solana-address-lookup-table-interface = { version = "=2.2.2", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=2.2.2"
solana-message = { version = "=2.4.0", features = ["bincode"] }
solana-program = "=2.3.0"
solana-sdk-ids = "=2.2.1"
solana-signature = { version = "=2.3.0", features = ["verify"] }
solana-transaction = { version = "=2.2.3", features = ["bincode"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
solana-keypair = "=2.2.3"
solana-signer = "=2.2.1"
