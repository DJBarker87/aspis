[package]
name = "aspis-v7-pair-forest-combined-rejection"
version = "0.1.0"
edition = "2021"
publish = false

# Release-evidence harness, intentionally outside the production workspace.
[workspace]

[dependencies]
anyhow = "1.0.100"
aspis-core = { path = "../../../crates/aspis-core", features = ["v7-fixed-canonical-audit"] }
aspis-pool = { path = "../../../programs/aspis-pool", features = ["no-entrypoint", "pair-forest-account-evidence"] }
aspis-statement = { path = "../../../crates/aspis-statement", features = ["pool-v1-kernel"] }
litesvm = "=0.16.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-compute-budget = "=4.2.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-program = "=2.3.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"
wincode = "=0.5.5"
