[package]
name = "aspis-pool-runtime-mock-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Keep the Solana 2.3 graph compatible with platform-tools rustc 1.84.1.
blake3 = "=1.5.5"
borsh = "=1.5.7"
indexmap = "=2.7.1"
proc-macro-crate = "=3.2.0"
solana-program = "=2.3.0"
zeroize = "=1.8.1"
