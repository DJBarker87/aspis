[package]
name = "aspis-verifier-receipt-runtime-evidence"
version = "0.1.0"
edition = "2021"
publish = false

# This is an isolated release-evidence harness, not a production workspace
# member. The replay script copies it into a clean archive of commit b484a877
# before resolving these paths.
[workspace]

[dependencies]
anyhow = "1.0.100"
aspis-core = { path = "../../../crates/aspis-core" }
aspis-statement = { path = "../../../crates/aspis-statement", features = ["pool-v1-kernel"] }
aspis-verifier = { path = "../../../programs/aspis-verifier", default-features = false, features = ["no-entrypoint", "v7-pool-dispatch-profile"] }
litesvm = "=0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-compute-budget-interface = "=3.0.0"
solana-instruction = "=3.4.0"
solana-instruction-error = "=2.4.0"
solana-keypair = "=3.1.2"
solana-program = "=2.3.0"
solana-sdk-ids = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"
solana-transaction-error = "=3.3.2"
wincode = "=0.5.5"
