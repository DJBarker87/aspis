[package]
name = "v5-relation-production-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["v5-production-tag67", "spend-production", "spend-dynamic-rate512"]
v5-production-tag67 = []
v5-cu-probe = []
spend-production = []
spend-dynamic-rate512 = []
no-entrypoint = []

[dependencies]
aspis-core = { path = "../../../crates/aspis-core" }
aspis-statement = { path = "../../../crates/aspis-statement", features = ["spend-dynamic-rate512"] }
borsh = { version = "=1.5.7", features = ["derive"] }
solana-program = "2.3.0"

[workspace]
