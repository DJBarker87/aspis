name: Profile23 integration

permissions:
  contents: read

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/aspis-core/**"
      - "crates/aspis-prover/**"
      - "crates/aspis-statement/**"
      - "programs/aspis-verifier/**"
      - "xtask/**"
      - "tools/**"
      - "results/stage2/**"
      - "release/profile23-q18-g37/**"
      - "paper/profile23/**"
      - ".github/workflows/profile23-integration.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/aspis-core/**"
      - "crates/aspis-prover/**"
      - "crates/aspis-statement/**"
      - "programs/aspis-verifier/**"
      - "xtask/**"
      - "tools/**"
      - "results/stage2/**"
      - "release/profile23-q18-g37/**"
      - "paper/profile23/**"
      - ".github/workflows/profile23-integration.yml"

jobs:
  profile23:
    runs-on: ubuntu-latest
    env:
      NO_DNA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Core fail-closed and transcript tests
        run: cargo test -q -p aspis-core profile23

      - name: Good23 and bounded-manager tests
        run: |
          cargo test -q -p aspis-prover --lib state_only_good23::tests
          cargo test -q -p aspis-prover --lib state_only_profile23_release::tests

      - name: Profile23 wire and privacy regressions
        run: |
          cargo test --release -q -p aspis-prover --test profile23_zero_factor_integration --features insecure-profile23-fixture profile23_d_tail_roundtrip_and_corruption_teeth
          cargo test -q -p aspis-prover --lib state_only_profile23_privacy_regressions

      - name: Exact q3 complete-Good replay
        run: cargo test --release -q -p aspis-prover --lib state_only_good23::tests::frozen_profile23_fixture_runs_exact_good23_on_all_selectors -- --ignored

      - name: Build and verify every valid selector
        run: cargo test --release -q -p aspis-prover --test profile23_zero_factor_integration --features insecure-profile23-fixture profile23_all_three_selectors_build_and_verify -- --ignored

      - name: Harness schema and proof override compile
        run: cargo check -q -p aspis-xtask

      - name: Devnet executor invariants
        run: cargo test -q -p aspis-xtask profile23_devnet

  release-bundle:
    name: Frozen Profile23 release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify q18/g37 bundle
        run: bash release/profile23-q18-g37/verify.sh
