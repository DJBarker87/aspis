name: Profile23 integration

permissions:
  contents: read

on:
  push:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CITATION.cff"
      - "archive/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/aspis-core/**"
      - "crates/aspis-prover/**"
      - "crates/aspis-statement/**"
      - "programs/aspis-verifier/**"
      - "xtask/**"
      - "tools/**"
      - "results/stage2/**"
      - "release/profile23-q18-g37-mainnet-v1/**"
      - "release/README.md"
      - "paper/profile23-mainnet-v1/**"
      - ".github/workflows/profile23-integration.yml"
  pull_request:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CITATION.cff"
      - "archive/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/aspis-core/**"
      - "crates/aspis-prover/**"
      - "crates/aspis-statement/**"
      - "programs/aspis-verifier/**"
      - "xtask/**"
      - "tools/**"
      - "results/stage2/**"
      - "release/profile23-q18-g37-mainnet-v1/**"
      - "release/README.md"
      - "paper/profile23-mainnet-v1/**"
      - ".github/workflows/profile23-integration.yml"

jobs:
  profile23:
    runs-on: ubuntu-latest
    env:
      NO_DNA: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-15

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Core fail-closed and transcript tests
        run: cargo test -q -p aspis-core profile23

      - name: Good23 and bounded-manager tests
        run: |
          cargo test -q -p aspis-prover --lib state_only_good23::tests
          cargo test -q -p aspis-prover --lib state_only_profile23_release::tests

      - name: Profile23 wire and privacy regressions
        run: |
          cargo test --release -q -p aspis-prover --test profile23_zero_factor_integration --features insecure-profile23-fixture profile23_d_tail_roundtrip_and_corruption_teeth
          cargo test -q -p aspis-prover --lib state_only_profile23_privacy_regressions

      - name: Exact q3 complete-Good replay
        run: cargo test --release -q -p aspis-prover --lib state_only_good23::tests::frozen_profile23_fixture_runs_exact_good23_on_all_selectors -- --ignored

      - name: Build and verify every valid selector
        run: cargo test --release -q -p aspis-prover --test profile23_zero_factor_integration --features insecure-profile23-fixture profile23_all_three_selectors_build_and_verify -- --ignored

      - name: Harness schema and proof override compile
        run: cargo check -q -p aspis-xtask

      - name: Release evaluator fail-closed tests
        run: cargo test -q -p aspis-xtask profile23_release

      - name: Mainnet executor invariants
        run: cargo test -q -p aspis-xtask 'profile23_mainnet::tests'

      - name: Devnet executor invariants
        run: cargo test -q -p aspis-xtask profile23_devnet

      - name: Offline mainnet recovery invariants
        run: |
          cargo test -q -p aspis-xtask profile23_mainnet_cleanup
          cargo test -q -p aspis-xtask profile23_mainnet_journal
          cargo test -q -p aspis-xtask profile23_mainnet_loader

  release-bundle:
    name: Frozen Profile23 release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify q18/g37 mainnet bundle
        run: bash release/profile23-q18-g37-mainnet-v1/verify.sh

      - name: Verify repository-to-bundle identity
        run: |
          cmp results/stage2/profile23_one_transaction_release.json release/profile23-q18-g37-mainnet-v1/certificates/release.json
          cmp results/stage2/profile23_mainnet_finalized_manifest.json release/profile23-q18-g37-mainnet-v1/evidence/mainnet-finalized-manifest.json
          cmp results/stage2/proofs/profile23_devnet_b1z_sequence0_q18_g37_production_authorizing_guarded_private.bin release/profile23-q18-g37-mainnet-v1/proof/profile23-q18-g37.bin
          cmp results/stage2/proofs/profile23_devnet_b1z_sequence0_q18_g37_production_authorizing_guarded_private.statement.json release/profile23-q18-g37-mainnet-v1/proof/statement.json
          cmp paper/profile23-mainnet-v1/profile23.pdf release/profile23-q18-g37-mainnet-v1/paper/profile23.pdf
