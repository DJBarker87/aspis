name: Lean formalization CI

on:
  push:
    paths:
      - 'AspisFormal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'AspisFormal/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and kernel-check the Lean formalization
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "AspisFormal"
