name: Lean formalization CI

on:
  push:
    paths:
      - 'AspisFormal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'AspisFormal/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and kernel-check the Lean formalization
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1.4.0
        with:
          lake-package-directory: "AspisFormal"
