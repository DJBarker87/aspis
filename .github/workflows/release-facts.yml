name: release-facts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-release-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check release facts and public claims
        run: python3 tools/check_release_facts.py --self-test
