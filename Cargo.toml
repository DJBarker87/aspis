[workspace]
members = [
    "crates/svm-cost-model",
    "programs/phase1-probe",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
base64 = "0.22.1"
borsh = { version = "1.5.7", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
csv = "1.4.0"
nalgebra = { version = "0.34.1", default-features = false, features = ["serde-serialize", "std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
solana-program = "2.3.0"
solana-sdk = "2.3.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
winterfell = "0.12.0"
winter-math = "0.12.0"

[patch.crates-io]
winter-crypto = { path = "third_party/solana-pqzk-fullchain/third-party/winter-crypto" }
winter-fri = { path = "third_party/solana-pqzk-fullchain/third-party/winter-fri" }
