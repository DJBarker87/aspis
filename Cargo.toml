[workspace]
members = [
    "crates/circle-p3-core",
    "crates/svm-cost-model",
    "crates/whir-jb-host",
    "crates/whir-ud-host",
    "crates/whir-m31-core",
    "crates/whir-m31-host",
    "programs/circle-p3-verifier",
    "programs/phase1-probe",
    "programs/whir-ud-verifier",
    "programs/whir-m31-verifier",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
base64 = "0.22.1"
borsh = { version = "1.5.7", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
csv = "1.4.0"
ciborium = "0.2.2"
nalgebra = { version = "0.34.1", default-features = false, features = ["serde-serialize", "std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
solana-program = "2.3.0"
solana-sdk = "2.3.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
winterfell = "0.12.0"
winter-math = "0.12.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false }

p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-air" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-challenger" }
p3-circle = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-circle" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-commit" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-field" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-fri" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-keccak" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-matrix" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-merkle-tree" }
p3-mersenne-31 = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-mersenne-31" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-symmetric" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-uni-stark" }
p3-util = { git = "https://github.com/Plonky3/Plonky3", rev = "0f87f2b543a01880274965c410bf804c124f5046", package = "p3-util" }

[patch.crates-io]
winter-crypto = { path = "third_party/solana-pqzk-fullchain/third-party/winter-crypto" }
winter-fri = { path = "third_party/solana-pqzk-fullchain/third-party/winter-fri" }
